name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run format:check
      - name: Pack and inspect release contents
        run: npm pack --json > pack-result.json
      - name: Verify actual package installation
        shell: bash
        run: |
          set -euo pipefail
          target="$(mktemp -d)"
          artifact="$(node -p '"pi-codex-native-compaction-" + require("./package.json").version + ".tgz"')"
          npm install --prefix "$target" --ignore-scripts --no-audit --no-fund "$PWD/$artifact"
          PI_NATIVE_TEST_EXTENSION="$target/node_modules/pi-codex-native-compaction/index.ts" npx tsx --test --test-name-pattern='packaged|migrate-' test/sdk.test.ts
          npm run smoke:install -- "$target/node_modules/pi-codex-native-compaction"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: pi-codex-native-compaction-*.tgz
          if-no-files-found: error
          retention-days: 14
